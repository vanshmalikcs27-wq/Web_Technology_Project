<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Webbio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/global.css">
  <style>
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-card {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 40px;
    }

    .auth-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .auth-header .logo {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 16px;
      color: var(--blue);
    }

    .auth-header h1 {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .auth-header p {
      color: var(--muted);
      font-size: 14px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .form-grid.full {
      grid-template-columns: 1fr;
    }

    .auth-footer {
      text-align: center;
      margin-top: 24px;
      color: var(--muted);
      font-size: 14px;
    }

    .auth-footer a {
      color: var(--blue);
    }

    .auth-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="logo">Webbio</div>
        <h1>Create Account</h1>
        <p>Join thousands of professionals building portfolios</p>
      </div>

      <div class="message-container" id="messageContainer"></div>

      <form id="signupForm">
        <div class="form-grid">
          <div class="form-group">
            <label>First Name</label>
            <input type="text" id="firstName" placeholder="John" required>
          </div>
          <div class="form-group">
            <label>Last Name</label>
            <input type="text" id="lastName" placeholder="Doe" required>
          </div>
        </div>

        <div class="form-group full">
          <label>Email</label>
          <input type="email" id="email" placeholder="you@example.com" required>
        </div>

        <div class="form-group full">
          <label>Password</label>
          <input type="password" id="password" placeholder="At least 6 characters" required>
        </div>

        <button type="submit" class="btn btn-primary">Create Account</button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Sign In</a>
      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script>
    checkAuthStatus();

    const form = document.getElementById('signupForm');
    const messageContainer = document.getElementById('messageContainer');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearMessages(messageContainer);

      const firstName = document.getElementById('firstName').value.trim();
      const lastName = document.getElementById('lastName').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const submitBtn = form.querySelector('button');

      if (!firstName || !lastName || !email || !password) {
        showError(messageContainer, 'All fields are required');
        return;
      }

      try {
        showLoading(submitBtn, 'Creating Account...');
        const result = await signup(email, password, firstName, lastName);
        showSuccess(messageContainer, result.message);
        
        setTimeout(() => {
          redirect('/pages/dashboard.html');
        }, 1500);
      } catch (error) {
        showError(messageContainer, error.message);
        hideLoading(submitBtn);
      }
    });
  </script>
</body>
</html>
