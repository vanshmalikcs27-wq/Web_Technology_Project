<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Webbio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/global.css">
  <style>
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-card {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 40px;
    }

    .auth-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .auth-header .logo {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 16px;
      color: var(--blue);
    }

    .auth-header h1 {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .auth-header p {
      color: var(--muted);
      font-size: 14px;
    }

    .remember-forgot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      margin-bottom: 20px;
    }

    .remember-forgot a {
      color: var(--blue);
    }

    .remember-forgot a:hover {
      text-decoration: underline;
    }

    .auth-footer {
      text-align: center;
      margin-top: 24px;
      color: var(--muted);
      font-size: 14px;
    }

    .auth-footer a {
      color: var(--blue);
    }

    .auth-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="logo">Webbio</div>
        <h1>Welcome Back</h1>
        <p>Sign in to your portfolio</p>
      </div>

      <div class="message-container" id="messageContainer"></div>

      <form id="loginForm">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="Your password" required>
        </div>

        <div class="remember-forgot">
          <label style="color: var(--muted); margin: 0;">
            <input type="checkbox" id="remember" style="margin-right: 6px;"> Remember me
          </label>
          <a href="#forgot">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary">Sign In</button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="signup.html">Create one</a>
      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script>
    checkAuthStatus();

    const form = document.getElementById('loginForm');
    const messageContainer = document.getElementById('messageContainer');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearMessages(messageContainer);

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const submitBtn = form.querySelector('button');

      if (!email || !password) {
        showError(messageContainer, 'Email and password required');
        return;
      }

      try {
        showLoading(submitBtn, 'Signing In...');
        const result = await login(email, password);
        showSuccess(messageContainer, result.message);
        
        setTimeout(() => {
          redirect('/pages/dashboard.html');
        }, 1500);
      } catch (error) {
        showError(messageContainer, error.message);
        hideLoading(submitBtn);
      }
    });
  </script>
</body>
</html>
