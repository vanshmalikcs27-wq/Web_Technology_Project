<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Webbio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/global.css">
  <style>
    .dashboard {
      min-height: 100vh;
      padding-top: 70px;
    }

    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: rgba(13, 13, 13, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 16px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }

    nav .logo {
      font-size: 20px;
      font-weight: 700;
      color: var(--blue);
    }

    nav .nav-right {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    nav .user-info {
      font-size: 13px;
      color: var(--muted);
    }

    nav .user-info .name {
      color: var(--text);
      font-weight: 600;
    }

    nav button {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 13px;
    }

    nav button:hover {
      border-color: var(--blue);
      color: var(--blue);
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .dashboard-header {
      margin-bottom: 40px;
    }

    .dashboard-header h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .dashboard-header p {
      color: var(--muted);
    }

    .dashboard-actions {
      display: flex;
      gap: 12px;
      margin-bottom: 40px;
    }

    .btn-new-portfolio {
      background: var(--blue);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-new-portfolio:hover {
      background: #5580ff;
      transform: translateY(-1px);
    }

    .portfolios-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .portfolio-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      transition: all 0.2s;
      cursor: pointer;
    }

    .portfolio-card:hover {
      border-color: var(--blue);
      transform: translateY(-4px);
      box-shadow: 0 16px 40px rgba(59, 110, 248, 0.15);
    }

    .portfolio-card-header {
      padding: 20px;
      border-bottom: 1px solid var(--border);
    }

    .portfolio-card-header h3 {
      font-size: 16px;
      margin-bottom: 4px;
    }

    .portfolio-card-header p {
      font-size: 12px;
      color: var(--muted);
    }

    .portfolio-card-body {
      padding: 20px;
    }

    .portfolio-card-body p {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 12px;
      line-height: 1.6;
    }

    .portfolio-card-footer {
      padding: 16px 20px;
      background: #0a0a0a;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
    }

    .portfolio-card-footer button {
      flex: 1;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
    }

    .portfolio-card-footer button:hover {
      border-color: var(--blue);
      color: var(--blue);
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .empty-state h2 {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .empty-state p {
      color: var(--muted);
      margin-bottom: 24px;
    }

    .badge {
      display: inline-block;
      background: var(--blue-dim);
      color: var(--blue);
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 12px;
      margin-right: 8px;
    }

    .badge.published {
      background: rgba(74, 222, 128, 0.1);
      color: #4ade80;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <nav>
    <div class="logo">Webbio</div>
    <div class="nav-right">
      <div class="user-info">
        Welcome, <span class="name" id="userName">User</span>
      </div>
      <button id="logoutBtn">Sign Out</button>
    </div>
  </nav>

  <div class="dashboard">
    <div class="container">
      <div class="dashboard-header">
        <h1>My Portfolios</h1>
        <p>Create and manage your professional portfolios</p>
      </div>

      <div class="message-container" id="messageContainer"></div>

      <div class="dashboard-actions">
        <button class="btn-new-portfolio" id="newPortfolioBtn">+ New Portfolio</button>
      </div>

      <div id="portfoliosContainer">
        <div class="loading">Loading your portfolios...</div>
      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script>
    requireAuth();

    const messageContainer = document.getElementById('messageContainer');
    const portfoliosContainer = document.getElementById('portfoliosContainer');
    const userNameEl = document.getElementById('userName');
    const newPortfolioBtn = document.getElementById('newPortfolioBtn');
    const logoutBtn = document.getElementById('logoutBtn');

    // Load user info
    async function loadUserInfo() {
      try {
        const result = await getCurrentUser();
        const fullName = `${result.user.firstName} ${result.user.lastName}`.trim();
        userNameEl.textContent = fullName || result.user.email;
      } catch (error) {
        console.error('Failed to load user info:', error);
      }
    }

    // Load portfolios
    async function loadPortfolios() {
      try {
        portfoliosContainer.innerHTML = '<div class="loading">Loading portfolios...</div>';
        const result = await getUserPortfolios();
        displayPortfolios(result.portfolios);
      } catch (error) {
        showError(messageContainer, 'Failed to load portfolios');
        portfoliosContainer.innerHTML = '';
      }
    }

    // Display portfolios
    function displayPortfolios(portfolios) {
      if (!portfolios || portfolios.length === 0) {
        portfoliosContainer.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">📝</div>
            <h2>No portfolios yet</h2>
            <p>Create your first portfolio to get started</p>
            <button class="btn-new-portfolio" id="emptyNewPortfolioBtn">+ Create Portfolio</button>
          </div>
        `;

        document.getElementById('emptyNewPortfolioBtn').addEventListener('click', goToBuilder);
        return;
      }

      portfoliosContainer.innerHTML = `
        <div class="portfolios-grid">
          ${portfolios.map(portfolio => `
            <div class="portfolio-card" onclick="goToEditor(${portfolio.id})">
              <div class="portfolio-card-header">
                <h3>${portfolio.title || 'Untitled Portfolio'}</h3>
                <p>${formatDate(portfolio.createdAt)}</p>
              </div>
              <div class="portfolio-card-body">
                <div>
                  ${portfolio.published ? '<span class="badge published">Published</span>' : ''}
                  <span class="badge">${portfolio.template}</span>
                </div>
                ${portfolio.bio ? `<p>${portfolio.bio.substring(0, 60)}...</p>` : '<p style="color: var(--muted2);">No description</p>'}
              </div>
              <div class="portfolio-card-footer">
                <button onclick="event.stopPropagation(); editPortfolio(${portfolio.id})">Edit</button>
                <button onclick="event.stopPropagation(); deletePortfolioPrompt(${portfolio.id})">Delete</button>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    // Go to builder
    function goToBuilder() {
      redirect('/pages/builder.html?action=create');
    }

    // Edit portfolio
    function editPortfolio(id) {
      redirect(`/pages/builder.html?action=edit&id=${id}`);
    }

    // Go to editor
    function goToEditor(id) {
      redirect(`/pages/builder.html?action=edit&id=${id}`);
    }

    // Delete portfolio
    async function deletePortfolioPrompt(id) {
      if (confirm('Are you sure you want to delete this portfolio? This cannot be undone.')) {
        try {
          await deletePortfolio(id);
          showSuccess(messageContainer, 'Portfolio deleted');
          setTimeout(loadPortfolios, 1000);
        } catch (error) {
          showError(messageContainer, 'Failed to delete portfolio');
        }
      }
    }

    // Logout
    logoutBtn.addEventListener('click', () => {
      logout();
      redirect('/pages/login.html');
    });

    // New portfolio button
    newPortfolioBtn.addEventListener('click', goToBuilder);

    // Load data on page load
    loadUserInfo();
    loadPortfolios();
  </script>
</body>
</html>
